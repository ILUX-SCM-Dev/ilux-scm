# CI de ILUX SCM: en cada Pull Request hacia main (y en cada push a main) GitHub corre
# las pruebas del backend y compila el front. Si algo falla, el PR muestra una ❌ y no se mezcla.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo lectura: el workflow no necesita escribir en el repo.
permissions:
  contents: read

# Si subes otro commit al mismo PR, cancela la corrida vieja (ahorra minutos del plan gratis).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisión de configuración
        run: python manage.py check

      - name: ¿Faltan migraciones?
        # Falla si alguien cambió un modelo y olvidó correr makemigrations
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
